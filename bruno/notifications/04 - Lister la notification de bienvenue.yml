info:
  name: 04 - Lister la notification de bienvenue
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/users/{{notificationsUserId}}/notifications"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonNotifications}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Le consommateur JMS crée la notification de façon asynchrone.
        for (let tentative = 0; tentative < 20; tentative++) {
            const resultat = await bru.sendRequest({
                method: "GET",
                url: bru.interpolate("{{baseUrl}}/users/{{notificationsUserId}}/notifications"),
                headers: { Authorization: bru.interpolate("Bearer {{jetonNotifications}}") },
                timeout: 2000
            });
            if (resultat.data.length > 0) break;
            await bru.sleep(250);
        }
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("La notification de bienvenue est présente et non lue", function () {
            const liste = res.getBody();
            expect(liste).to.be.an("array");
            expect(liste).to.have.lengthOf(1);
            expect(liste[0].isRead).to.equal(false);
            bru.setVar("notificationBienvenueId", String(liste[0].notifId));
            expect(liste[0]).to.have.property("notifId");
            expect(liste[0]).to.have.property("titre");
            expect(liste[0]).to.have.property("message");
            expect(liste[0]).to.have.property("isRead");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
