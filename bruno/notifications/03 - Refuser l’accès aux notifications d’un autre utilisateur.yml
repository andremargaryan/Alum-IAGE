info:
  name: 03 - Refuser l’accès aux notifications d’un autre utilisateur
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users/4/notifications"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonNotifications}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 403", function () {
            expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
