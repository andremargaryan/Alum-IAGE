info:
  name: 05 - Lister uniquement les non lues
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/users/{{notificationsUserId}}/notifications?unreadOnly=true"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonNotifications}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Toutes les notifications retournées sont non lues", function () {
            const liste = res.getBody();
            expect(liste).to.be.an("array");
            for (const notif of liste) {
                expect(notif.isRead).to.equal(false);
            }
            const ids = liste.map(n => n.notifId);
            expect(ids).to.include(Number(bru.getVar("notificationBienvenueId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
