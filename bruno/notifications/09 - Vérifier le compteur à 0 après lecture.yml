info:
  name: 09 - Vérifier le compteur à 0 après lecture
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/users/{{notificationsUserId}}/notifications/unread-count"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonNotifications}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Le compteur est maintenant à 0", function () {
            expect(Number(res.getBody())).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
