info:
  name: 04 - Lister les notifications de Hugo
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/users/3/notifications"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonHugo}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Contient les notifications de Hugo", function () {
            const liste = res.getBody();
            expect(liste).to.be.an("array");
            expect(liste.length).to.be.at.least(3);
            expect(liste[0]).to.have.property("notifId");
            expect(liste[0]).to.have.property("titre");
            expect(liste[0]).to.have.property("message");
            expect(liste[0]).to.have.property("isRead");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
