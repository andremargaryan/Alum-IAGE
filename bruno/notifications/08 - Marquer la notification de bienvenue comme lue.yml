info:
  name: 08 - Marquer la notification de bienvenue comme lue
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{baseUrl}}/users/{{notificationsUserId}}/notifications/{{notificationBienvenueId}}/read"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{jetonNotifications}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut HTTP 204", function () {
            expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
