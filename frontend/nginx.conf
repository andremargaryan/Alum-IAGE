# Configuration nginx du front en Docker (http://localhost:4202).
# Même rôle que proxy.conf.json avec "npm start" : relayer les appels API vers le backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Appels à l'API Spring : "backend" est le nom du service dans docker-compose.yml
    # On garde l'hôte du navigateur (localhost:4202) : sinon Spring voit une origine différente
    # de l'hôte, traite l'appel comme du CORS et le refuse (403), car seul localhost:4200 est autorisé.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    location /users {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    # Routes Angular (/forum, /evenements...) : on renvoie index.html, le routeur Angular fait le reste
    location / {
        try_files $uri $uri/ /index.html;
    }
}
