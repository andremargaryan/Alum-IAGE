# Configuration nginx du front en Docker (http://localhost:4202).
# Même rôle que proxy.conf.json avec "npm start" : relayer les appels API vers le backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Appels à l'API Spring : "backend" est le nom du service dans docker-compose.yml
    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /users {
        proxy_pass http://backend:8080;
    }

    # Routes Angular (/forum, /evenements...) : on renvoie index.html, le routeur Angular fait le reste
    location / {
        try_files $uri $uri/ /index.html;
    }
}
