<a class="bouton bouton-discret retour" routerLink="/forum">← Retour aux posts</a>

<form class="carte formulaire-page" [formGroup]="formulaire" (ngSubmit)="publier()">
  <h2>Nouveau post</h2>

  <label class="champ">
    <span>Thématique</span>
    <select formControlName="categorieId">
      @for (categorie of categories; track categorie.id) {
        <option [value]="categorie.id">{{ categorie.libelle }}</option>
      }
    </select>
  </label>

  <label class="champ">
    <span>Titre</span>
    <input type="text" formControlName="titre" placeholder="Ta question ou ton annonce en une phrase" />
    @if (champInvalide('titre')) {
      <small class="erreur-champ">Le titre est obligatoire (200 caractères max).</small>
    }
  </label>

  <label class="champ">
    <span>Message</span>
    <textarea formControlName="description" rows="7" placeholder="Donne le contexte, les détails utiles…"></textarea>
    @if (champInvalide('description')) {
      <small class="erreur-champ">Le message est obligatoire.</small>
    }
  </label>

  @if (erreur()) {
    <p class="message-erreur">{{ erreur() }}</p>
  }

  <div class="actions-formulaire">
    <a class="bouton bouton-discret" routerLink="/forum">Annuler</a>
    <button class="bouton bouton-plein" type="submit" [disabled]="envoiEnCours()">
      {{ envoiEnCours() ? 'Publication…' : 'Publier' }}
    </button>
  </div>
</form>
