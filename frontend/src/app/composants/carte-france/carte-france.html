<svg class="carte-svg" viewBox="0 0 610 600" role="img" aria-label="Carte des membres par ville">
  <path class="pays" [attr.d]="contour" />
  <path class="pays" [attr.d]="corse" />

  @for (point of pointsSurCarte(); track point.ville) {
    <g class="point" [attr.transform]="'translate(' + point.x + ' ' + point.y + ')'">
      <circle class="halo" [attr.r]="point.rayon + 9" />
      <circle class="coeur" [attr.r]="point.rayon" />
      <g class="etiquette" transform="translate(0 -30)">
        <rect x="-62" y="-15" width="124" height="28" rx="14" />
        <text text-anchor="middle" y="4">{{ point.ville }} · {{ point.nombre }}</text>
      </g>
    </g>
  }
</svg>

@if (autresVilles().length > 0) {
  <p class="autres">
    Aussi :
    @for (v of autresVilles(); track v.ville; let dernier = $last) {
      {{ v.ville }} ({{ v.nombre }}){{ dernier ? '' : ', ' }}
    }
  </p>
}
