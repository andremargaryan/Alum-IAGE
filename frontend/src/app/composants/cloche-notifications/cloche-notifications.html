<button class="bouton-rond" type="button" (click)="basculer()" aria-label="Notifications">
  <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z" /><path d="M10 20.5a2 2 0 0 0 4 0" /></svg>
  @if (nonLues() > 0) {
    <span class="pastille">{{ nonLues() }}</span>
  }
</button>

@if (ouvert()) {
  <div class="voile" (click)="fermer()"></div>
  <div class="panneau">
    <div class="panneau-entete">
      <strong>Notifications</strong>
      @if (nonLues() > 0) {
        <button class="lien-texte" type="button" (click)="toutMarquerLu()">Tout marquer comme lu</button>
      }
    </div>

    @if (chargement()) {
      <p class="vide">Chargement…</p>
    } @else if (notifications().length === 0) {
      <p class="vide">Aucune notification pour l'instant.</p>
    } @else {
      <ul class="liste">
        @for (notif of notifications(); track notif.notifId) {
          <li>
            <button type="button" class="notif" [class.non-lue]="!notif.isRead" (click)="ouvrir(notif)">
              <span class="notif-titre">{{ notif.titre }}</span>
              <span class="notif-message">{{ notif.message }}</span>
              <span class="notif-date">{{ notif.createdAt | date: 'd MMM, HH:mm' }}</span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
}
