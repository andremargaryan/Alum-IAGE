<button class="declencheur" type="button" (click)="basculer()" aria-label="Mon compte">
  <app-avatar [initiales]="mesInitiales()" [teinte]="maTeinte()" taille="petit" />
</button>

@if (ouvert()) {
  <div class="voile" (click)="basculer()"></div>
  <div class="panneau">
    <p class="nom">{{ utilisateur()?.prenom }} {{ utilisateur()?.nom }}</p>
    <p class="detail">{{ utilisateur()?.email }}</p>
    <span class="badge teinte-gris">{{ libelleRole() }}</span>
    <button class="bouton bouton-discret deconnexion" type="button" (click)="deconnecter()">Se déconnecter</button>
  </div>
}
