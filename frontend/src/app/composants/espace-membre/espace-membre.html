<div class="espace">
  <aside class="barre-laterale">
    <a class="marque" routerLink="/tableau-de-bord">SILLAGE</a>

    <nav class="navigation">
      @for (lien of liens; track lien.chemin) {
        <a class="lien" [routerLink]="lien.chemin" routerLinkActive="actif">
          <span class="icone">
            @switch (lien.icone) {
              @case ('grille') {
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" /></svg>
              }
              @case ('calendrier') {
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
              }
              @case ('personnes') {
                <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5" /><circle cx="17" cy="9" r="2.5" /><path d="M17 14.5c2.3 0 4 1.4 4.5 4" /></svg>
              }
              @case ('bulle') {
                <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" /></svg>
              }
            }
          </span>
          {{ lien.libelle }}
        </a>
      }
    </nav>

    <p class="pied">le réseau des miagistes.</p>
  </aside>

  <div class="zone-principale">
    <header class="barre-haut">
      <h1 class="titre">{{ titre() }}</h1>
      <div class="actions">
        <app-cloche-notifications />
        <app-menu-profil />
      </div>
    </header>

    <main class="contenu">
      <router-outlet />
    </main>
  </div>
</div>
